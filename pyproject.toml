[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firnpack"
version = "0.1.0"
description = "a glacier for your files — every commit a single packed layer of history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13.16"
dependencies = []
authors = [{ name = "Fabrizio Hernandez" }]
keywords = ["version control", "vcs", "backup", "single-user", "archive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Software Development :: Version Control",
]

[project.scripts]
firnpack = "firnpack:main"
firn = "firnpack:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools]
py-modules = ["firnpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]
