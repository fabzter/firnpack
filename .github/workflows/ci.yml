name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# NOTE (2026-10-20): `ubuntu-latest` migrates to Ubuntu 26 beginning
# 2026-10-19 (actions/runner-images#14748). Kept as-is deliberately:
# the suite is pure-stdlib and platform-agnostic; pinning an image
# would only add drift. Revisit only if a job fails on the new image.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: "3.13.16"
          - os: ubuntu-latest
            py: "3.13"
          - os: ubuntu-latest
            py: "3.14"
          - os: ubuntu-latest
            py: "3.15"
          - os: windows-latest
            py: "3.13.16"
          - os: windows-latest
            py: "3.13"
          - os: windows-latest
            py: "3.15"
          - os: macos-latest
            py: "3.15"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/ -q

  wheel-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: wheel contains exactly one module
        run: |
          python - <<'EOF'
          import zipfile, glob, sys
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel built"
          names = [n for n in zipfile.ZipFile(wheels[0]).namelist()
                   if not n.startswith("firnpack-")]
          assert names == ["firnpack.py"], names
          print("wheel guard OK:", names)
          EOF
